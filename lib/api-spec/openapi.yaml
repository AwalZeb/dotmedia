openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: work
    description: Public portfolio and protected work management
  - name: storage
    description: Uploaded media storage and serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /work:
    get:
      operationId: listPublicWork
      tags: [work]
      summary: List published portfolio work
      parameters:
        - in: query
          name: featured
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Published work items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItem"
  /admin/work:
    get:
      operationId: listAdminWork
      tags: [work]
      summary: List all portfolio work for administrators
      responses:
        "200":
          description: All work items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkItem"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
    post:
      operationId: createWorkItem
      tags: [work]
      summary: Create a portfolio work item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemInput"
      responses:
        "201":
          description: Created work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400":
          description: Invalid work item
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /admin/work/{id}:
    patch:
      operationId: updateWorkItem
      tags: [work]
      summary: Update a portfolio work item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemUpdate"
      responses:
        "200":
          description: Updated work item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItem"
        "400":
          description: Invalid work item
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Work item not found
    delete:
      operationId: deleteWorkItem
      tags: [work]
      summary: Delete a portfolio work item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Work item deleted
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Work item not found
  /admin/auth/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check whether the administrator session is active
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
    post:
      operationId: startAdminSession
      tags: [admin]
      summary: Start a password-protected administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Password was not accepted
        "429":
          description: Too many login attempts
        "503":
          description: Administrator password is not configured
  /admin/auth/logout:
    post:
      operationId: endAdminSession
      tags: [admin]
      summary: End the administrator session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Save a contact enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryCreatedResponse"
        "400":
          description: Invalid enquiry
        "429":
          description: Too many submissions
  /admin/enquiries:
    get:
      operationId: listAdminEnquiries
      tags: [admin, enquiries]
      summary: List contact enquiries for administrators
      responses:
        "200":
          description: Enquiries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
        "401":
          description: Administrator session required
    patch:
      operationId: updateAdminEnquiry
      tags: [admin, enquiries]
      summary: Change an enquiry status
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryUpdate"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "401":
          description: Administrator session required
        "404":
          description: Enquiry not found
  /clients:
    get:
      operationId: listPublicClients
      tags: [content]
      summary: List client names and optional logos
      responses:
        "200":
          description: Public client strip
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
  /admin/clients:
    get:
      operationId: listAdminClients
      tags: [admin, content]
      summary: List editable client entries
      responses:
        "200":
          description: All client entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
        "401":
          description: Administrator session required
    post:
      operationId: createClient
      tags: [admin, content]
      summary: Add a client entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          description: Administrator session required
  /admin/clients/{id}:
    patch:
      operationId: updateClient
      tags: [admin, content]
      summary: Update a client entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          description: Administrator session required
        "404":
          description: Client not found
    delete:
      operationId: deleteClient
      tags: [admin, content]
      summary: Delete a client entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Client deleted
        "401":
          description: Administrator session required
        "404":
          description: Client not found
  /case-study/healthcare:
    get:
      operationId: getPublicHealthcareCaseStudy
      tags: [content]
      summary: Get the healthcare case study
      responses:
        "200":
          description: Healthcare case study
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcareCaseStudy"
  /admin/case-study/healthcare:
    get:
      operationId: getAdminHealthcareCaseStudy
      tags: [admin, content]
      summary: Get the editable healthcare case study
      responses:
        "200":
          description: Healthcare case study
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcareCaseStudy"
        "401":
          description: Administrator session required
    put:
      operationId: updateHealthcareCaseStudy
      tags: [admin, content]
      summary: Update the healthcare case study
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthcareCaseStudyInput"
      responses:
        "200":
          description: Updated healthcare case study
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcareCaseStudy"
        "401":
          description: Administrator session required
  /testimonials:
    get:
      operationId: listPublicTestimonials
      tags: [content]
      summary: List published testimonials
      responses:
        "200":
          description: Published testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
  /admin/testimonials:
    get:
      operationId: listAdminTestimonials
      tags: [admin, content]
      summary: List testimonials for administrators
      responses:
        "200":
          description: All testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
        "401":
          description: Administrator session required
    post:
      operationId: createTestimonial
      tags: [admin, content]
      summary: Add a testimonial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialInput"
      responses:
        "201":
          description: Created testimonial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"
        "401":
          description: Administrator session required
  /admin/testimonials/{id}:
    patch:
      operationId: updateTestimonial
      tags: [admin, content]
      summary: Update a testimonial
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialUpdate"
      responses:
        "200":
          description: Updated testimonial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"
        "401":
          description: Administrator session required
        "404":
          description: Testimonial not found
    delete:
      operationId: deleteTestimonial
      tags: [admin, content]
      summary: Delete a testimonial
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Testimonial deleted
        "401":
          description: Administrator session required
        "404":
          description: Testimonial not found
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [admin, storage]
      summary: Request a presigned URL for uploading portfolio media
      description: |
        Administrators send JSON metadata about the file (never the file itself)
        and receive a presigned URL to PUT the bytes directly into App Storage.
        Only images and videos within the size limits are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Administrator session required
        "413":
          description: File is larger than the allowed size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: File type is not supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [storage]
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public. Searches PUBLIC_OBJECT_SEARCH_PATHS for the given
        file path and redirects to a short-lived signed storage URL for the first match.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "302":
          description: Redirect to a signed storage URL that serves the file
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve uploaded portfolio media
      description: |
        Serves media uploaded through the presigned URL flow. Uploaded portfolio
        media is public website content, so no session is required to view it.
        Responds with a redirect to a short-lived signed storage URL; storage
        serves the bytes with the stored Content-Type and native range support.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (for example `uploads/some-uuid`).
      responses:
        "302":
          description: Redirect to a signed storage URL that serves the object
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: Object path is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (for example `image/jpeg` or `video/mp4`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned App Storage URL for the PUT upload.
        objectPath:
          type: string
          description: Normalized object path (for example `/objects/uploads/uuid`). Store this as the media URL.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WorkItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        clientName:
          type: string
        category:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        mediaUrl:
          type: ["string", "null"]
        mediaType:
          type: string
          enum: [image, video, external]
        featured:
          type: boolean
        published:
          type: boolean
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - clientName
        - category
        - description
        - imageUrl
        - mediaUrl
        - mediaType
        - featured
        - published
        - displayOrder
        - createdAt
    WorkItemInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        clientName:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        mediaUrl:
          type: ["string", "null"]
        mediaType:
          type: string
          enum: [image, video, external]
        featured:
          type: boolean
        published:
          type: boolean
        displayOrder:
          type: integer
      required:
        - title
        - clientName
        - category
        - description
        - featured
        - published
    WorkItemUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        clientName:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        mediaUrl:
          type: ["string", "null"]
        mediaType:
          type: string
          enum: [image, video, external]
        featured:
          type: boolean
        published:
          type: boolean
        displayOrder:
          type: integer
    AdminSession:
      type: object
      required: [authenticated, configured]
      properties:
        authenticated:
          type: boolean
        configured:
          type: boolean
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
    Enquiry:
      type: object
      required: [id, fullName, phone, email, businessName, businessType, services, message, status, createdAt]
      properties:
        id:
          type: integer
        fullName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        businessName:
          type: string
        businessType:
          type: string
        services:
          type: array
          items:
            type: string
        message:
          type: string
        status:
          type: string
          enum: [new, contacted, closed]
        createdAt:
          type: string
          format: date-time
    EnquiryInput:
      type: object
      required: [fullName, phone, website]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 5
          maxLength: 40
        email:
          type: ["string", "null"]
          format: email
        businessName:
          type: string
          maxLength: 160
        businessType:
          type: string
        services:
          type: array
          items:
            type: string
        message:
          type: string
          maxLength: 5000
        website:
          type: string
          description: Honeypot field; must remain empty
    EnquiryCreatedResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    EnquiryUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, contacted, closed]
    Client:
      type: object
      required: [id, name, logoUrl, displayOrder]
      properties:
        id:
          type: integer
        name:
          type: string
        logoUrl:
          type: ["string", "null"]
        displayOrder:
          type: integer
    ClientInput:
      type: object
      required: [name, logoUrl, displayOrder]
      properties:
        name:
          type: string
          minLength: 1
        logoUrl:
          type: ["string", "null"]
        displayOrder:
          type: integer
    ClientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        logoUrl:
          type: ["string", "null"]
        displayOrder:
          type: integer
    HealthcareCaseStudy:
      type: object
      required: [id, clientName, description, category, updatedAt]
      properties:
        id:
          type: integer
        clientName:
          type: string
        description:
          type: string
        category:
          type: string
        updatedAt:
          type: string
          format: date-time
    HealthcareCaseStudyInput:
      type: object
      required: [clientName, description, category]
      properties:
        clientName:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
    Testimonial:
      type: object
      required: [id, name, role, quote, imageUrl, published, displayOrder, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        quote:
          type: string
        imageUrl:
          type: ["string", "null"]
        published:
          type: boolean
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
    TestimonialInput:
      type: object
      required: [name, role, quote, imageUrl, published, displayOrder]
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
        quote:
          type: string
          minLength: 1
        imageUrl:
          type: ["string", "null"]
        published:
          type: boolean
        displayOrder:
          type: integer
    TestimonialUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
        quote:
          type: string
          minLength: 1
        imageUrl:
          type: ["string", "null"]
        published:
          type: boolean
        displayOrder:
          type: integer

